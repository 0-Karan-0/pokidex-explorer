<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e53935">
<title>PokéDex Explorer — Find Pokémon &amp; Power</title>
<link rel="icon" href="pokidex-logo-removebg.png">
<style>
:root{
  --bg:#12141f;--panel:#1b1e2e;--panel2:#242840;--line:#2f3454;--text:#f3f5ff;--mut:#98a0c8;
  --red:#ff4b4b;--yel:#ffcb05;--blu:#3b82f6;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(900px 400px at 50% -120px,#3a1520 0%,transparent 70%);min-height:100vh}
button,input,select{font:inherit;color:inherit}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(var(--safe-t) + 10px) 12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;max-width:1200px;margin:0 auto 8px}
.ball{width:30px;height:30px;flex:none}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.3px}
.brand h1 b{color:var(--yel)}
.brand small{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.bar{display:flex;gap:8px;max-width:1200px;margin:0 auto 8px}
.sw{position:relative;flex:1;min-width:0}
.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
#q{width:100%;height:44px;padding:0 38px 0 38px;border-radius:14px;border:2px solid var(--line);background:var(--panel);outline:none;font-size:16px}
#q:focus{border-color:var(--red)}
#clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:var(--panel2);display:none;cursor:pointer}
#sort{height:44px;border-radius:14px;border:2px solid var(--line);background:var(--panel);padding:0 8px;max-width:130px;outline:none}
#fav{height:44px;width:44px;flex:none;border-radius:14px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px}
#fav.on{background:var(--red);border-color:var(--red)}
.row{display:flex;gap:6px;overflow-x:auto;max-width:1200px;margin:0 auto 6px;padding:2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{color:#fff;border-color:transparent;background:var(--c,var(--red))}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip.on i{background:#fff}
.lbl{flex:none;align-self:center;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding-right:2px}
.info{max-width:1200px;margin:10px auto 0;padding:0 12px;color:var(--mut);font-size:13px;display:flex;justify-content:space-between}
/* ---------- grid ---------- */
main{max-width:1200px;margin:0 auto;padding:10px 12px calc(40px + var(--safe-b))}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){#grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){#grid{grid-template-columns:repeat(4,1fr);gap:14px}}
@media(min-width:1000px){#grid{grid-template-columns:repeat(5,1fr)}}
.card{position:relative;border-radius:18px;padding:10px 10px 12px;cursor:pointer;overflow:hidden;border:1.5px solid var(--line);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 38%,var(--panel)) 0%,var(--panel) 62%);
  content-visibility:auto;contain-intrinsic-size:auto 230px;transition:transform .12s,border-color .12s}
.card:active{transform:scale(.97)}
@media(hover:hover){.card:hover{transform:translateY(-3px);border-color:var(--c1)}}
.card .no{font-size:11px;font-weight:700;color:var(--mut)}
.card .lk{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;text-decoration:none;color:#fff;font-size:14px}
.card .lk:active{background:var(--red)}
.card .hrt{position:absolute;right:42px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);border:0;cursor:pointer;font-size:14px;padding:0;opacity:.75}
.card .hrt.on{opacity:1;background:var(--red)}
.card img{display:block;width:96px;height:96px;margin:2px auto 0;image-rendering:pixelated;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.card .nm{font-weight:800;font-size:15px;text-align:center;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tys{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.ty{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:999px;color:#fff;background:var(--c)}
.pw{display:flex;align-items:center;gap:6px}
.tier{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:900;font-size:13px;color:#1a1a1a}
.t-S{background:linear-gradient(135deg,#ffe066,#ff9f1c)}.t-A{background:#ff6b6b}.t-B{background:#4ecdc4}.t-C{background:#a0aec0}.t-D{background:#718096;color:#fff}
.meter{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.meter span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4ecdc4,#ffcb05,#ff4b4b)}
.pv{flex:none;font-size:12px;font-weight:800;min-width:30px;text-align:right}
.star{position:absolute;left:8px;top:26px;font-size:13px}
#more{height:1px}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--mut)}
.empty b{display:block;font-size:40px}
/* ---------- modal / bottom sheet ---------- */
#ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
#ov.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--panel);border-radius:26px 26px 0 0;border:1.5px solid var(--line);border-bottom:0;
  padding:0 16px calc(18px + var(--safe-b));animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:600px){#ov{align-items:center}.sheet{border-radius:26px;border-bottom:1.5px solid var(--line)}}
.hd{position:sticky;top:0;display:flex;justify-content:space-between;padding:12px 0 4px;z-index:2;background:linear-gradient(var(--panel) 70%,transparent)}
.hd button{width:40px;height:40px;border-radius:50%;border:0;background:var(--panel2);cursor:pointer;font-size:16px}
.hero{border-radius:20px;padding:6px;margin-bottom:12px;text-align:center;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c1) 55%,transparent),transparent 70%)}
.hero img{width:210px;height:210px;max-width:60vw;max-height:60vw;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.mt{text-align:center}.mt .no{color:var(--mut);font-weight:700}.mt h2{margin:0 0 8px;font-size:26px}
.mt .tys{margin-bottom:10px}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.bd{font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;background:var(--panel2)}
.bd.big{display:flex;gap:6px;align-items:center}
.st{display:grid;grid-template-columns:64px 36px 1fr;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.st em{font-style:normal;color:var(--mut);font-weight:700}.st b{text-align:right}
.st .meter{height:10px}
.st .meter span{background:var(--sc)}
.tot{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-weight:800}
.act{display:flex;gap:8px;margin-top:16px}
.act a,.act button{flex:1;height:46px;border-radius:14px;border:0;font-weight:800;cursor:pointer;text-decoration:none;display:grid;place-items:center;font-size:14px}
.act .go{background:var(--red);color:#fff;flex:2}
.act .nv{background:var(--panel2);flex:1}
.leg{margin:18px 0 0;font-size:11.5px;color:var(--mut);text-align:center}

[data-th=light]{--bg:#f2f4fb;--panel:#fff;--panel2:#e7ebf6;--line:#d3d9ed;--text:#1b1f33;--mut:#5b6590}
[data-th=light] body{background-image:radial-gradient(900px 400px at 50% -120px,#ffd3d3 0%,transparent 70%)}
.ib{margin-left:6px;width:36px;height:36px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-size:16px;padding:0;flex:none}
.brand small{margin-right:2px}
.ball{animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sub{padding:10px 12px 0;margin-bottom:0}
.card{animation:pop .3s both;box-shadow:0 2px 0 rgba(0,0,0,.15)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.card::before{content:"";position:absolute;right:-34px;bottom:-34px;width:130px;height:130px;border-radius:50%;
  border:13px solid rgba(255,255,255,.07);background:linear-gradient(transparent 42%,rgba(255,255,255,.07) 42% 58%,transparent 58%);pointer-events:none}
.card img{background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%);position:relative}
@media(hover:hover){.card:hover{box-shadow:0 10px 26px color-mix(in srgb,var(--c1) 40%,transparent)}.card:hover img{transform:scale(1.12) translateY(-3px)}}
.card img{transition:transform .18s}
#grid.list{grid-template-columns:1fr}
@media(min-width:760px){#grid.list{grid-template-columns:1fr 1fr}}
#grid.list .card{display:grid;grid-template-columns:72px 1fr;column-gap:10px;align-items:center;padding:8px 86px 8px 8px;contain-intrinsic-size:auto 88px}
#grid.list .card>*{grid-column:2}
#grid.list .card img{grid-column:1;grid-row:1/5;width:72px;height:72px}
#grid.list .nm{text-align:left;margin:0 0 3px}#grid.list .tys{justify-content:flex-start;margin-bottom:5px}
#grid.list .star{left:auto;right:84px;top:44px}
.hero{background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c1) 60%,transparent),transparent 68%)}
.mx h4{margin:12px 0 6px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.mx .tys{justify-content:flex-start}
#up{position:fixed;right:14px;bottom:calc(16px + var(--safe-b));width:46px;height:46px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:20px;
  box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;display:none;z-index:15}
</style>
</head>

    <img class="ball" src="pokidex-logo-removebg.png" alt="">

  <div class="row" id="rType"></div>
</header>

<main><div id="grid"></div><div id="more"></div></main>

<div id="ov" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

/* filter + sort + incremental render */
let list=[],shown=0;const BATCH=40;
function apply(){
  const q=S.q.trim().toLowerCase(), num=/^#?\d+$/.test(q)?parseInt(q.replace("#",""),10):null;
  list=P.filter(p=>{
    if(q){ if(num!==null){ if(p.id!==num && !String(p.id).startsWith(String(num))) return false; }
      else if(!p.low.includes(q) && !p.types.includes(q)) return false; }
    if(S.type && p.t1!==S.type && p.t2!==S.type) return false;
    if(S.gen && p.gen!==S.gen) return false;
    if(S.fav && !favs.has(p.id)) return false;
    const t=S.tier; if(t==="L"&&p.flag!==1) return false; if(t==="M"&&p.flag!==2) return false;
    if("SABCD".includes(t)&&t.length===1&&p.tier!==t) return false;
    return true;});
  const k=S.sort;
  if(k==="id") list.sort((a,b)=>a.id-b.id);
  else if(k==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
  else list.sort((a,b)=>b[k]-a[k]||a.id-b.id);
  $("cnt").textContent=list.length+" / "+P.length;
  $("grid").innerHTML=""; shown=0;
  if(!list.length){ $("grid").innerHTML=`<div class="empty"><b>😢</b>Koi Pokémon nahi mila${S.fav?" — pehle ♥ se favorites add karo":""}</div>`; return;}
  more(); window.scrollTo({top:0});
}
function more(){
  if(shown>=list.length) return;
  const end=Math.min(shown+BATCH,list.length);

  $("grid").insertAdjacentHTML("beforeend",h); shown=end;
}

[[2,6,9,10],[15],[]],[[15,16,18],[10,11,12,13],[]],[[2,7,18],[8,17],[14]],[[4,9],[2,7,17],[16]]];
function match(p){const m=Array(19).fill(1);
  [p.t1,p.t2].filter(Boolean).forEach(d=>{const[w,r,i]=X[d];w.forEach(a=>m[a]*=2);r.forEach(a=>m[a]*=.5);i.forEach(a=>m[a]*=0)});
  const g=f=>{let a="";for(let t=1;t<19;t++)if(f(m[t]))a+=`<span class="ty" style="--c:${TC[t]}">${TY[t]}${m[t]===4?" ×4":m[t]===.25?" ×¼":""}</span>`;return a};
  const sec=(h,f)=>{const s=g(f);return s?`<h4>${h}</h4><div class="tys">${s}</div>`:""};
  return `<div class="mx">${sec("💥 Weak to",x=>x>1)}${sec("🛡 Resists",x=>x<1&&x>0)}${sec("🚫 Immune to",x=>x===0)}</div>`}
function radar(p){const v=[p.hp,p.atk,p.def,p.spe,p.spd,p.spa],L=["HP","Atk","Def","Spe","SpD","SpA"],cx=110,cy=105,R=66;
  const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)]};
  const ring=k=>[0,1,2,3,4,5].map(i=>pt(i,R*k)).join(" ");
  const poly=v.map((x,i)=>pt(i,R*Math.min(1,x/180))).join(" ");
  const lab=L.map((l,i)=>{const[x,y]=pt(i,R+18);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="var(--mut)">${l} ${v[i]}</text>`}).join("");
  return `<svg viewBox="-10 0 240 210" width="100%" style="max-width:300px;display:block;margin:0 auto 6px"><g fill="none" stroke="var(--line)"><polygon points="${ring(1)}"/><polygon points="${ring(.66)}"/><polygon points="${ring(.33)}"/></g><polygon points="${poly}" fill="${TC[p.t1]}" fill-opacity=".45" stroke="${TC[p.t1]}" stroke-width="2.5" stroke-linejoin="round"/>${lab}</svg>`}
/* extras */
$("vw").onclick=()=>{const l=$("grid").classList.toggle("list");$("vw").textContent=l?"▦":"☰"};
$("rnd").onclick=()=>open(1+Math.floor(Math.random()*P.length));
const setTh=l=>{document.documentElement.dataset.th=l?"light":"";try{localStorage.setItem("pf-th",l?"1":"")}catch(e){}};
try{if(localStorage.getItem("pf-th"))setTh(1)}catch(e){}
$("th").onclick=()=>setTh(document.documentElement.dataset.th!=="light");
$("up").onclick=()=>scrollTo({top:0,behavior:"smooth"});
addEventListener("scroll",()=>{$("up").style.display=scrollY>700?"block":"none"},{passive:true});
const hh=parseInt(location.hash.slice(1));if(hh>0&&hh<=P.length)open(hh);
apply();
</script>
